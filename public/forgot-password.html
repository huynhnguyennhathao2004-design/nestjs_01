<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quên mật khẩu - Vietnam Travel TTS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/forgot-password.css" />
</head>

<body>
  <main class="forgot-page">
    <section class="forgot-card">
      <a href="/index.html" class="forgot-logo">
        Vietnam <span>Travel TTS</span>
      </a>

      <h1>Quên mật khẩu</h1>

      <p class="forgot-desc">
        Nhập email tài khoản của bạn để xác nhận và đặt lại mật khẩu mới.
      </p>

      <form id="emailForm" class="forgot-form">
        <div class="form-group">
          <label for="email">Email tài khoản</label>
          <input
            type="email"
            id="email"
            placeholder="Nhập email đã đăng ký"
            autocomplete="email"
            required
          />
        </div>

        <p class="forgot-message" id="emailMessage"></p>

        <button type="submit" class="forgot-submit">
          Tiếp tục
        </button>
      </form>

      <form id="resetForm" class="forgot-form hidden">
        <div class="form-group">
          <label for="newPassword">Mật khẩu mới</label>
          <div class="password-box">
            <input
              type="password"
              id="newPassword"
              placeholder="Nhập mật khẩu mới"
              required
            />

            <button type="button" class="eye-btn" id="toggleNewPassword" aria-label="Hiện mật khẩu">
              <svg viewBox="0 0 24 24">
                <path d="M12 5C7 5 3.1 8.1 1.5 12C3.1 15.9 7 19 12 19C17 19 20.9 15.9 22.5 12C20.9 8.1 17 5 12 5ZM12 16.5C9.5 16.5 7.5 14.5 7.5 12C7.5 9.5 9.5 7.5 12 7.5C14.5 7.5 16.5 9.5 16.5 12C16.5 14.5 14.5 16.5 12 16.5ZM12 9.2C10.5 9.2 9.2 10.5 9.2 12C9.2 13.5 10.5 14.8 12 14.8C13.5 14.8 14.8 13.5 14.8 12C14.8 10.5 13.5 9.2 12 9.2Z"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <div class="password-box">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Nhập lại mật khẩu mới"
              required
            />

            <button type="button" class="eye-btn" id="toggleConfirmPassword" aria-label="Hiện mật khẩu">
              <svg viewBox="0 0 24 24">
                <path d="M12 5C7 5 3.1 8.1 1.5 12C3.1 15.9 7 19 12 19C17 19 20.9 15.9 22.5 12C20.9 8.1 17 5 12 5ZM12 16.5C9.5 16.5 7.5 14.5 7.5 12C7.5 9.5 9.5 7.5 12 7.5C14.5 7.5 16.5 9.5 16.5 12C16.5 14.5 14.5 16.5 12 16.5ZM12 9.2C10.5 9.2 9.2 10.5 9.2 12C9.2 13.5 10.5 14.8 12 14.8C13.5 14.8 14.8 13.5 14.8 12C14.8 10.5 13.5 9.2 12 9.2Z"></path>
              </svg>
            </button>
          </div>
        </div>

        <p class="forgot-message" id="resetMessage"></p>

        <button type="submit" class="forgot-submit">
          Cập nhật mật khẩu
        </button>
      </form>

      <a href="/login.html" class="back-login">← Quay lại đăng nhập</a>
    </section>
  </main>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
