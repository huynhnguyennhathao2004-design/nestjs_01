<body>
  <main class="login-page">
    <div class="login-overlay"></div>

    <section class="login-card">
      <link rel="stylesheet" href="/css/login.css" />
      <a href="/index.html" class="login-logo">
        Vietnam <span>Travel TTS</span>
      </a>

      <h1>Đăng nhập</h1>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Nhập email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            />

            <button type="button" id="togglePassword" class="eye-btn" aria-label="Hiện mật khẩu">
              <svg id="eyeIcon" viewBox="0 0 24 24">
                <path d="M12 5C7 5 3.1 8.1 1.5 12C3.1 15.9 7 19 12 19C17 19 20.9 15.9 22.5 12C20.9 8.1 17 5 12 5ZM12 16.5C9.5 16.5 7.5 14.5 7.5 12C7.5 9.5 9.5 7.5 12 7.5C14.5 7.5 16.5 9.5 16.5 12C16.5 14.5 14.5 16.5 12 16.5ZM12 9.2C10.5 9.2 9.2 10.5 9.2 12C9.2 13.5 10.5 14.8 12 14.8C13.5 14.8 14.8 13.5 14.8 12C14.8 10.5 13.5 9.2 12 9.2Z"></path>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="button"
          class="google-login-btn"
          id="googleLoginBtn"
        >
          Đăng nhập bằng Google
        </button>

        <p class="register-text">
          Chưa có tài khoản?

          <a href="/register.html">
            Tạo tài khoản
          </a>
        </p>

        <div class="form-options">
          <label class="remember-box">
            <input type="checkbox" id="rememberMe" />
            <span>Ghi nhớ đăng nhập</span>
          </label>

          <a href="/forgot-password.html" class="forgot-link">Quên mật khẩu?</a> </div>
          
        <p class="login-message" id="loginMessage"></p>

        <button type="submit" class="login-submit">
          Đăng nhập
        </button>
      </form>
      <div class="register-link-box">
        <span>Chưa có tài khoản?</span>

        <a href="/register.html">
          Tạo tài khoản
        </a>
      </div>

      <a href="/index.html" class="back-home">← Quay về trang chủ</a>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
